  <script>
  (function () {
    "use strict";

    /* ── 1. Render accordion from FAQ_DATA ─────────────── */

    var grid    = document.getElementById('iwFaqGrid');
    var chevron = '<svg class="iw-faqpage-chevron" viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true"><path d="M5 7.5 L10 12.5 L15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var idCount = 0;

    FAQ_DATA.forEach(function (group) {
      var groupEl = document.createElement('div');
      groupEl.className = 'iw-faqpage-group reveal';

      var heading = document.createElement('h2');
      heading.className = 'iw-faqpage-group-heading';
      heading.innerHTML = '<span class="iw-faqpage-group-icon" aria-hidden="true">' + group.icon + '</span>' + escHtml(group.title);
      groupEl.appendChild(heading);

      var dl = document.createElement('dl');
      dl.className = 'iw-faqpage-list';

      group.items.forEach(function (item) {
        idCount++;
        var answerId = 'fa-' + idCount;

        var wrapper = document.createElement('div');
        wrapper.className = 'iw-faqpage-item';
        wrapper.setAttribute('itemscope', '');
        wrapper.setAttribute('itemprop', 'mainEntity');
        wrapper.setAttribute('itemtype', 'https://schema.org/Question');

        var dt = document.createElement('dt');
        dt.className = 'iw-faqpage-q';
        dt.setAttribute('itemprop', 'name');

        var btn = document.createElement('button');
        btn.className = 'iw-faqpage-btn';
        btn.setAttribute('aria-expanded', 'false');
        btn.setAttribute('aria-controls', answerId);
        btn.innerHTML = escHtml(item.q) + chevron;

        dt.appendChild(btn);

        var dd = document.createElement('dd');
        dd.className = 'iw-faqpage-a';
        dd.id = answerId;
        dd.hidden = true;
        dd.setAttribute('itemscope', '');
        dd.setAttribute('itemprop', 'acceptedAnswer');
        dd.setAttribute('itemtype', 'https://schema.org/Answer');

        var p = document.createElement('p');
        p.setAttribute('itemprop', 'text');
        p.textContent = item.a;
        dd.appendChild(p);

        wrapper.appendChild(dt);
        wrapper.appendChild(dd);
        dl.appendChild(wrapper);
      });

      groupEl.appendChild(dl);
      grid.appendChild(groupEl);
    });


    /* ── 2. Inject JSON-LD structured data ─────────────── */

    var allItems = [];
    FAQ_DATA.forEach(function (group) {
      group.items.forEach(function (item) {
        allItems.push({
          "@type": "Question",
          "name": item.q,
          "acceptedAnswer": { "@type": "Answer", "text": item.a }
        });
      });
    });

    var ldScript = document.createElement('script');
    ldScript.type = 'application/ld+json';
    ldScript.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": allItems
    });
    document.head.appendChild(ldScript);


    /* ── 3. Accordion behaviour ─────────────────────────── */

    grid.addEventListener('click', function (e) {
      var btn = e.target.closest('.iw-faqpage-btn');
      if (!btn) return;

      var expanded = btn.getAttribute('aria-expanded') === 'true';
      var answer   = document.getElementById(btn.getAttribute('aria-controls'));
      var list     = btn.closest('.iw-faqpage-list');

      /* Close siblings in same group */
      list.querySelectorAll('.iw-faqpage-btn').forEach(function (other) {
        if (other !== btn) {
          other.setAttribute('aria-expanded', 'false');
          var a = document.getElementById(other.getAttribute('aria-controls'));
          if (a) a.hidden = true;
        }
      });

      btn.setAttribute('aria-expanded', String(!expanded));
      if (answer) answer.hidden = expanded;
    });


    /* ── 4. Scroll reveal ───────────────────────────────── */

    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });

    /* Observe static reveal elements + dynamically created groups */
    document.querySelectorAll('.reveal').forEach(function (el) { obs.observe(el); });


    /* ── Helper ─────────────────────────────────────────── */

    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

  })();
  </script>
